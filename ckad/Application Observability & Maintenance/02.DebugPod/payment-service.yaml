apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: maintenance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
        - name: payment-container
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting payment service..."
              echo "ERROR: Missing configuration file"
              exit 1
